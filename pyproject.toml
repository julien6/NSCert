[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "invariant-mawm"
version = "0.1.0"
description = "Auditable partial-invariant discovery and certification primitives"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]
tracking = ["wandb>=0.17"]

[project.scripts]
invariant-mawm = "invariant_mawm.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

